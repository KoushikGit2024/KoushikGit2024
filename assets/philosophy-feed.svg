  <rect width="950" height="42" rx="6" fill="#0B111C" stroke="#1E293B" stroke-width="1.2"/>
  <text x="16" y="26" class="mono" font-size="14" font-weight="700" fill="#00E5FF">❯</text>
  <text x="32" y="26" class="mono" font-size="12" font-weight="600" fill="#64748B">echo $AXIOM:</text>
  <g transform="translate(145, 26)" class="mono" font-size="12.5">
    <text class="quote-0" fill="#E2E8F0">&quot;Simplicity is prerequisite for reliability.&quot; <tspan fill="#00E5FF">— Edsger W. Dijkstra</tspan></text>
    <text class="quote-1" fill="#E2E8F0">&quot;Make it work, make it right, make it fast.&quot; <tspan fill="#00E5FF">— Kent Beck</tspan></text>
    <text class="quote-2" fill="#E2E8F0">&quot;Premature optimization is the root of all evil.&quot; <tspan fill="#00E5FF">— Donald Knuth</tspan></text>
    <text class="quote-3" fill="#E2E8F0">&quot;Clean code always looks like it was written by someone who cares.&quot; <tspan fill="#00E5FF">— Robert C. Martin</tspan></text>
    <text class="quote-4" fill="#E2E8F0">&quot;First, solve the problem. Then, write the code.&quot; <tspan fill="#00E5FF">— John Johnson</tspan></text>
    <text class="quote-5" fill="#E2E8F0">&quot;Deleted code is debugged code.&quot; <tspan fill="#00E5FF">— Jeff Sickel</tspan></text>
    <text class="quote-6" fill="#E2E8F0">&quot;Good programmers worry about data structures and their relationships.&quot; <tspan fill="#00E5FF">— Linus Torvalds</tspan></text>
    <text class="quote-7" fill="#E2E8F0">&quot;Programs must be written for people to read, and only incidentally for machines.&quot; <tspan fill="#00E5FF">— Harold Abelson</tspan></text>
    <text class="quote-8" fill="#E2E8F0">&quot;There are only two hard things: cache invalidation and naming things.&quot; <tspan fill="#00E5FF">— Phil Karlton</tspan></text>
    <text class="quote-9" fill="#E2E8F0">&quot;The function of good software is to make the complex appear simple.&quot; <tspan fill="#00E5FF">— Grady Booch</tspan></text>
    <text class="quote-10" fill="#E2E8F0">&quot;Talk is cheap. Show me the code.&quot; <tspan fill="#00E5FF">— Linus Torvalds</tspan></text>
    <text class="quote-11" fill="#E2E8F0">&quot;Perfection is achieved when there is nothing left to take away.&quot; <tspan fill="#00E5FF">— Antoine de Saint-Exupéry</tspan></text>
    <text class="quote-12" fill="#E2E8F0">&quot;Testing leads to failure, and failure leads to understanding.&quot; <tspan fill="#00E5FF">— Burt Rutan</tspan></text>
    <text class="quote-13" fill="#E2E8F0">&quot;Before software can be reusable it first has to be usable.&quot; <tspan fill="#00E5FF">— Ralph Johnson</tspan></text>
    <text class="quote-14" fill="#E2E8F0">&quot;Architecture is about the important stuff. Whatever that is.&quot; <tspan fill="#00E5FF">— Ralph Johnson</tspan></text>
    <text class="quote-15" fill="#E2E8F0">&quot;Complexity is the enemy of execution.&quot; <tspan fill="#00E5FF">— Tony Robbins</tspan></text>
    <text class="quote-16" fill="#E2E8F0">&quot;The best error message is the one that never shows up.&quot; <tspan fill="#00E5FF">— Thomas Fuchs</tspan></text>
    <text class="quote-17" fill="#E2E8F0">&quot;If you can&#x27;t explain it simply, you don&#x27;t understand it well enough.&quot; <tspan fill="#00E5FF">— Albert Einstein</tspan></text>
    <text class="quote-18" fill="#E2E8F0">&quot;Software is a combination between artistry and engineering.&quot; <tspan fill="#00E5FF">— Bill Gates</tspan></text>
    <text class="quote-19" fill="#E2E8F0">&quot;Any code you haven&#x27;t looked at for six months might as well be written by someone else.&quot; <tspan fill="#00E5FF">— Alan Perlis</tspan></text>
    <text class="quote-20" fill="#E2E8F0">&quot;Idempotency is the secret superpower of distributed systems.&quot; <tspan fill="#00E5FF">— Systems Axiom</tspan></text>
    <text class="quote-21" fill="#E2E8F0">&quot;Write code as if the person who maintains it is a violent psychopath who knows where you live.&quot; <tspan fill="#00E5FF">— John Woods</tspan></text>
    <text class="quote-22" fill="#E2E8F0">&quot;Every complex system that works evolved from a simple system that worked.&quot; <tspan fill="#00E5FF">— John Gall</tspan></text>
    <text class="quote-23" fill="#E2E8F0">&quot;Quality is not an act, it is a habit.&quot; <tspan fill="#00E5FF">— Aristotle</tspan></text>
    <text class="quote-24" fill="#E2E8F0">&quot;Optimism is an occupational hazard of programming: feedback is the treatment.&quot; <tspan fill="#00E5FF">— Kent Beck</tspan></text>
  </g>
